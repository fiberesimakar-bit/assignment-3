name: Assignment 3 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x app/app.sh scripts/*.sh tests/*.sh

      - name: Validate Bash syntax
        run: |
          bash -n app/app.sh
          bash -n scripts/lint.sh
          bash -n scripts/build.sh
          bash -n tests/test.sh

  test:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x app/app.sh scripts/*.sh tests/*.sh

      - name: Run lint
        run: ./scripts/lint.sh

      - name: Run tests
        run: ./tests/test.sh

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x app/app.sh scripts/*.sh tests/*.sh

      - name: Build Docker image
        run: ./scripts/build.sh
